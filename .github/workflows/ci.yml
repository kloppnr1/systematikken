name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Systematikken.slnx

  # On main: build the image and, if the server is set up, deploy it.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/kloppnr1/systematikken:latest
      # The image goes straight to the server over SSH, so the server needs no registry login.
      - name: Deploy to the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        if: env.HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp deploy/compose.yaml deploy/Caddyfile deploy/backup-offsite.sh "deploy@$HOST:/opt/systematikken/"
          docker save ghcr.io/kloppnr1/systematikken:latest | gzip | ssh "deploy@$HOST" "gunzip | docker load"
          ssh "deploy@$HOST" "cd /opt/systematikken && docker compose up -d && docker image prune -f"
          # The app answers on /health once it has started and migrated the database.
          for i in $(seq 1 30); do
            if ssh "deploy@$HOST" "docker compose -f /opt/systematikken/compose.yaml exec -T caddy wget -q -O - http://app:8080/health" ; then exit 0; fi
            sleep 2
          done
          echo "The app did not answer on /health after deploy" && exit 1
