# One pull request per ecosystem per month, with all updates grouped. CI runs the tests on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
    ignore:
      # Stay on .NET 10 (supported until November 2028). Move to the next LTS on purpose, not by a bot.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
